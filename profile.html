  <script>
    /* Apply the saved theme before the page paints (prevents a white flash) */
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('cd_theme'));
        if (t !== 'dark' && t !== 'light') { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
