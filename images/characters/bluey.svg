  <!-- Румянец -->
  <circle cx="68" cy="132" r="9" fill="#ff7aa5" opacity=".45" />
  <circle cx="132" cy="132" r="9" fill="#ff7aa5" opacity=".45" />
  
  <!-- Глаза -->
  <ellipse cx="78" cy="106" rx="11" ry="14" fill="#fff" />
  <ellipse cx="122" cy="106" rx="11" ry="14" fill="#fff" />
  <circle cx="80" cy="108" r="6" fill="#3b2316" />
  <circle cx="120" cy="108" r="6" fill="#3b2316" />
  <circle cx="82" cy="105" r="2" fill="#fff" />
  <circle cx="122" cy="105" r="2" fill="#fff" />
  
  <!-- Носик -->
